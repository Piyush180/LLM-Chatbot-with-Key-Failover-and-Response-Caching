services:
  backend:
    build:
      context: ./backend
      target: runtime
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/app.db
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - app-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app-data:
